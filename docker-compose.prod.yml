services:
  postgres:
    image: postgres:16
    ports:
      - "13132:5432"   # 严格按 G=1 公式：13000 + 100 + 32 = 13132
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-game}
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_dev_pwd}
    volumes:
      - game_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  game-user:
    #build:
    #  context: .
    #  dockerfile: src/Game.User/Dockerfile
    image: ghcr.io/longlonggames/game-match3-server/game-user:v0.2.1
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION}
      Jwt__Issuer: battle-net-mp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  game-leaderboard:
    #build:
    #  context: .
    #  dockerfile: src/Game.Leaderboard/Dockerfile
    image: ghcr.io/longlonggames/game-match3-server/game-leaderboard:v0.2.1
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION}
      Jwt__Issuer: battle-net-mp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  game-core:
    #build:
    #  context: .
    #  dockerfile: src/Game.Core/Dockerfile
    image: ghcr.io/longlonggames/game-match3-server/game-core:v0.2.1
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION}
      Jwt__Issuer: battle-net-mp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  game-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "13180:80"    # 严格按 G=1 公式：13000 + 100 + 80 = 13180
    depends_on:
      - game-user
      - game-leaderboard
      - game-core
    restart: unless-stopped

volumes:
  game_pgdata:
