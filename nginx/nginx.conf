worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;

    upstream game_user {
        server game-user:8080;
    }

    upstream game_leaderboard {
        server game-leaderboard:8080;
    }

    upstream game_core {
        server game-core:8080;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            return 200 '{"status":"ok","service":"game-gateway"}';
            add_header Content-Type application/json;
        }

        location /api/v1/user/ {
            proxy_pass http://game_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/leaderboard/ {
            proxy_pass http://game_leaderboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/game/ {
            proxy_pass http://game_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
